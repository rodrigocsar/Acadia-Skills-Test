<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Toastify CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- CSS -->

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/reponsive.css" />
    <title>Acadia Test</title>
  </head>

  <body>
    <div class="modal-overlay" id="productModal">
      <div class="modal">
        <h3>Add New Product</h3>

        <input type="text" id="modalName" placeholder="Product name" />

        <textarea
          id="modalDescription"
          placeholder="Product description"
        ></textarea>

        <input
          type="number"
          id="modalPrice"
          placeholder="Price"
          step="0.01"
          min="0"
        />

        <input type="file" id="modalImage" accept="image/*" />

        <div class="modal-actions">
          <button id="cancelModal" class="btn-secondary" title="Cancel">
            Cancel
          </button>
          <button id="confirmModal" class="btn-primary" title="Add Product">
            Add Product
          </button>
        </div>
      </div>
    </div>

    <!--IMPLEMENTAÇÃO EXTRA DELETE CONFIRM MODAL -->
    <div class="modal-overlay" id="deleteModal">
      <div class="modal confirm-modal">
        <h3>Are you sure you want to remove this product?</h3>
        <div class="modal-actions">
          <button id="cancelDelete" class="btn-secondary">No</button>
          <button id="confirmDelete" class="btn-primary">Yes</button>
        </div>
      </div>
    </div>
    <!-- HEADER -->
    <header>
      <h1>Products</h1>

      <input
        type="text"
        id="searchInput"
        placeholder="Search product..."
        class="search-input"
      />

      <div class="theme">
        <i class="fa-solid fa-sun" title="Theme Light"></i>
        <i class="fa-regular fa-moon" title="Theme Dark"></i>
      </div>

      <div class="cart-icon" id="cartIcon" title="items in affection">
        <i class="fa-solid fa-cart-shopping" title="Your Cart"></i>
        <span class="cart-count" id="cartCount">0</span>
      </div>
    </header>

    <main class="container">
      <button id="addProductBtn" class="add-sample-btn" title="Add Product">
        + Add Product
      </button>

      <!-- PRODUCT GRID (LOADED VIA API) -->
      <div class="product-grid" id="productGrid">
        <p class="loading">Loading products...</p>
      </div>

      <!-- CART SIDEBAR -->
      <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
          <h2>Your Cart</h2>
          <button id="closeCart" class="close-btn">×</button>
        </div>

        <div class="cart-items" id="cartItems">
          <div id="emptyCartMessage" class="empty-cart">
            <span>Your cart is empty</span>
          </div>
          <!-- Added products appear here -->
        </div>

        <div class="cart-footer">
          <div class="cart-total">
            Total: <span id="cartTotal" class="price">$0.00</span>
          </div>
          <button class="checkout-btn" title="Go to payment">
            Go to payment
          </button>
        </div>
      </aside>
    </main>

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Toastify JS (BEFORE your JS) -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Your Script -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
